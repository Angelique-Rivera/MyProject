<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    .box {
      background: #222;
      padding: 25px;
      width: 250px;
      margin: 100px auto;
      border-radius: 10px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
    }

    button {
      background: hotpink;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Login</h2>
  <input id="user" placeholder="Username"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
  <p id="msg"></p>
</div>

<script>
function login() {
  if (user.value == "admin" && pass.value == "12345")
    msg.innerHTML = "Login successful!";
  else
    msg.innerHTML = "Wrong username or password!";
}
</script>

</body>
</html>
